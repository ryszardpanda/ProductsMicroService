spring.application.name=ProductMicroService

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shop_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shop_pass}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


spring.jpa.hibernate.ddl-auto=none


spring.liquibase.change-log=classpath:liquibase/liquibase_changelog.yaml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false


logging.level.liquibase=DEBUG
logging.level.liquibase.changelog=DEBUG
logging.level.liquibase.database=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port=8420